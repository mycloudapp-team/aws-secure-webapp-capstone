
name: Deploy MyCloudApp

on:
  push:
    branches:
      - phil
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mycloudapp-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Install dependencies
        working-directory: App
        run: npm ci

      - name: Build React application
        working-directory: App
        run: npm run build

      - name: Verify production build
        run: test -s App/dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package application
        run: tar -czf mycloudapp-build.tar.gz -C App/dist .

      - name: Upload build to S3
        run: |
          aws s3 cp mycloudapp-build.tar.gz \
            s3://mycloudapps3/builds/mycloudapp-build.tar.gz

      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -Eeuo pipefail

          BUCKET="mycloudapps3"
          ARCHIVE="/tmp/mycloudapp-build.tar.gz"
          STAGING="/var/www/mycloudapp-staging"
          LIVE="/var/www/mycloudapp"
          BACKUP="/var/www/mycloudapp-previous"

          command -v aws >/dev/null 2>&1 || {
            echo "AWS CLI is not installed on EC2"
            exit 1
          }

          aws s3 cp \
            "s3://${BUCKET}/builds/mycloudapp-build.tar.gz" \
            "$ARCHIVE"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          tar -xzf "$ARCHIVE" -C "$STAGING"

          test -s "$STAGING/index.html" || {
            echo "Build validation failed: index.html missing"
            exit 1
          }

          chown -R ec2-user:ec2-user "$STAGING"
          find "$STAGING" -type d -exec chmod 755 {} \;
          find "$STAGING" -type f -exec chmod 644 {} \;

          rm -rf "$BACKUP"

          if [ -d "$LIVE" ]; then
            mv "$LIVE" "$BACKUP"
          fi

          mv "$STAGING" "$LIVE"

          if nginx -t && systemctl reload nginx; then
            rm -rf "$BACKUP"
            rm -f "$ARCHIVE"
            echo "Deployment completed successfully"
          else
            echo "Deployment failed. Restoring previous website."

            rm -rf "$LIVE"

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$LIVE"
            fi

            nginx -t && systemctl reload nginx || true
            exit 1
          fi
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E81JP33JXL6GL \
            --paths "/*"
